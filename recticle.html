<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hot & Cold Radar Prototype</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #111; font-family: sans-serif; }
        
        /* The Hot & Cold Border */
        #radarBorder {
            transition: box-shadow 0.1s ease-out, border-color 0.1s ease-out;
            box-shadow: inset 0 0 50px rgba(59, 130, 246, 0.5); /* Starts Blue */
        }

        /* Center Scanner Reticle */
        .reticle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            border: 2px dashed rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
            transition: all 0.2s;
        }
        
        .reticle-locked {
            border: 3px solid #10b981; /* Green when perfectly aimed */
            transform: translate(-50%, -50%) scale(1.2);
            background: rgba(16, 185, 129, 0.2);
        }
    </style>
</head>
<body class="text-slate-800">

    <!-- 3D Viewer Container -->
    <div id="viewer" class="absolute inset-0 cursor-grab active:cursor-grabbing"></div>

    <!-- UI Overlay -->
    <div id="radarBorder" class="absolute inset-0 border-8 border-blue-500 pointer-events-none z-10"></div>
    
    <div class="absolute top-6 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white px-6 py-3 rounded-xl shadow-2xl z-20 text-center border border-slate-700 backdrop-blur-sm">
        <h2 class="font-bold text-lg mb-1">Find the Hidden Point</h2>
        <p id="statusText" class="text-blue-400 font-mono font-bold tracking-widest uppercase">STATUS: COLD</p>
    </div>

    <!-- The Scanner -->
    <div id="scannerReticle" class="reticle z-20"></div>

    <!-- Reveal Popup -->
    <div id="revealMessage" class="absolute inset-0 bg-slate-900/80 z-50 flex flex-col items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="text-6xl mb-4">🎉</div>
        <h2 class="text-4xl font-bold text-white mb-2">Target Acquired!</h2>
        <p class="text-emerald-400 font-medium">You successfully scanned the hidden point.</p>
        <button onclick="location.reload()" class="mt-8 bg-emerald-500 hover:bg-emerald-600 text-white px-6 py-2 rounded-lg font-bold transition-transform hover:scale-105">Play Again</button>
    </div>

    <script>
        // --- PROTOTYPE SETUP ---
        let scene, camera, renderer, sphere;
        let isDragging = false, startX = 0, startY = 0, lon = 0, lat = 0;
        let targetVector = new THREE.Vector3();
        let isLockedOn = false;

        function init() {
            const container = document.getElementById('viewer');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1100);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            // Use a wireframe grid instead of an image to avoid loading/CORS issues in the prototype
            const geometry = new THREE.SphereGeometry(500, 60, 40);
            geometry.scale(-1, 1, 1);
            const material = new THREE.MeshBasicMaterial({ 
                color: 0x334155, 
                wireframe: true 
            });
            sphere = new THREE.Mesh(geometry, material);
            scene.add(sphere);

            // --- DEFINE THE HIDDEN TARGET ---
            // Let's hide it randomly somewhere in the 360 space
            const randomLat = (Math.random() - 0.5) * 100; // -50 to 50
            const randomLon = Math.random() * 360;
            
            // Convert Lat/Lon to a 3D Direction Vector
            const phi = THREE.MathUtils.degToRad(90 - randomLat);
            const theta = THREE.MathUtils.degToRad(randomLon);
            targetVector.set(
                Math.sin(phi) * Math.cos(theta),
                Math.cos(phi),
                Math.sin(phi) * Math.sin(theta)
            ).normalize();

            // Setup Controls
            container.addEventListener('mousedown', (e) => { isDragging = true; startX = e.clientX; startY = e.clientY; });
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                lon = (startX - e.clientX) * 0.1 + lon;
                lat = (e.clientY - startY) * 0.1 + lat;
                startX = e.clientX;
                startY = e.clientY;
            });
            document.addEventListener('mouseup', () => { isDragging = false; });
            
            // Mobile Touch Support
            container.addEventListener('touchstart', (e) => { isDragging = true; startX = e.touches[0].clientX; startY = e.touches[0].clientY; }, {passive:false});
            document.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                lon = (startX - e.touches[0].clientX) * 0.1 + lon;
                lat = (e.touches[0].clientY - startY) * 0.1 + lat;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            }, {passive:false});
            document.addEventListener('touchend', () => { isDragging = false; });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // Handle the click to reveal
            container.addEventListener('click', () => {
                if (isLockedOn) {
                    const msg = document.getElementById('revealMessage');
                    msg.classList.remove('hidden');
                    setTimeout(() => msg.classList.remove('opacity-0'), 10);
                }
            });

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);

            lat = Math.max(-85, Math.min(85, lat));
            const phi = THREE.MathUtils.degToRad(90 - lat);
            const theta = THREE.MathUtils.degToRad(lon);

            camera.target = new THREE.Vector3(
                500 * Math.sin(phi) * Math.cos(theta),
                500 * Math.cos(phi),
                500 * Math.sin(phi) * Math.sin(theta)
            );
            camera.lookAt(camera.target);
            renderer.render(scene, camera);

            updateRadar();
        }

        function updateRadar() {
            // 1. Get the direction the camera is currently looking
            const cameraDirection = new THREE.Vector3();
            camera.getWorldDirection(cameraDirection);

            // 2. Calculate the angle between where we are looking and the hidden target
            // This returns a value from 0 (looking directly at it) to ~3.14 (looking opposite)
            const angle = cameraDirection.angleTo(targetVector);

            // 3. Define how wide the "radar zone" is. 
            // 1.5 radians is roughly a 90-degree cone in front of the camera.
            const radarZoneRadius = 1.5; 

            const border = document.getElementById('radarBorder');
            const status = document.getElementById('statusText');
            const reticle = document.getElementById('scannerReticle');

            // If we are looking generally towards it, calculate the heat
            if (angle < radarZoneRadius) {
                // Normalize the heat from 0 (edge of radar zone) to 1 (dead center)
                const heat = 1 - (angle / radarZoneRadius);

                // Convert heat to an RGB color (Blue -> Purple -> Red)
                // Red goes up as heat goes up. Blue goes down as heat goes up.
                const r = Math.round(255 * heat);
                const b = Math.round(255 * (1 - heat));
                const glowIntensity = Math.round(10 + (90 * heat));

                border.style.borderColor = `rgb(${r}, 0, ${b})`;
                border.style.boxShadow = `inset 0 0 ${glowIntensity}px rgba(${r}, 0, ${b}, 0.8)`;

                // Update Status Text based on heat
                if (heat > 0.95) {
                    // LOCK ON! Angle is very tiny.
                    status.textContent = "TARGET LOCKED - CLICK TO SCAN";
                    status.className = "text-emerald-400 font-mono font-bold tracking-widest uppercase animate-pulse";
                    border.style.borderColor = "#10b981"; // Emerald Green
                    border.style.boxShadow = "inset 0 0 100px rgba(16, 185, 129, 0.6)";
                    reticle.classList.add('reticle-locked');
                    isLockedOn = true;
                } else if (heat > 0.6) {
                    status.textContent = "STATUS: VERY HOT";
                    status.className = "text-red-500 font-mono font-bold tracking-widest uppercase";
                    reticle.classList.remove('reticle-locked');
                    isLockedOn = false;
                } else if (heat > 0.3) {
                    status.textContent = "STATUS: WARM";
                    status.className = "text-purple-400 font-mono font-bold tracking-widest uppercase";
                    reticle.classList.remove('reticle-locked');
                    isLockedOn = false;
                } else {
                    status.textContent = "STATUS: LUKEWARM";
                    status.className = "text-indigo-400 font-mono font-bold tracking-widest uppercase";
                    reticle.classList.remove('reticle-locked');
                    isLockedOn = false;
                }
            } else {
                // Outside the radar zone completely
                border.style.borderColor = "#3b82f6"; // Default Blue
                border.style.boxShadow = "inset 0 0 20px rgba(59, 130, 246, 0.3)";
                status.textContent = "STATUS: COLD";
                status.className = "text-blue-500 font-mono font-bold tracking-widest uppercase";
                reticle.classList.remove('reticle-locked');
                isLockedOn = false;
            }
        }

        init();
    </script>
</body>
</html>
